[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fpga-amp-model"
version = "0.1.0"
description = "Physically informed vacuum-tube audio reference and FPGA models"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "matplotlib>=3.7", "PyYAML>=6.0"]

[tool.setuptools]
package-dir = {"" = "model/python"}

[tool.setuptools.packages.find]
where = ["model/python"]

[tool.pyright]
include = ["model/python", "model/tests", "scripts"]
